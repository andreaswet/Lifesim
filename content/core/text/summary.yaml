# Sentences the narrator assembles into the year summary (design §10.3).

- id: summary.growing
  variants:
    - when: "fact.age < 3"
      text: "You grow out of everything you own, twice."
    - when: "fact.age < 3"
      text: "Most of the year goes on eating, sleeping and getting bigger."
    - when: "fact.age >= 3 && fact.age < 13"
      text: "You grow again; last year's shoes no longer fit."
    - when: "fact.age >= 3 && fact.age < 13"
      text: "You are faster than you were a year ago, and you can reach the next shelf up."
    - when: "fact.age >= 3 && fact.age < 13"
      text: "The pencil marks on the door frame move up another two inches."
    - when: "fact.age >= 3 && fact.age < 13"
      text: "You are taller by the end of the year, and stronger, and hungry most of the time."
    - when: "fact.age >= 13"
      text: "You grow in bursts this year, and your coordination takes a while to catch up."
    - when: "fact.age >= 13"
      text: "You are stronger than you were last year without having done much to earn it."
    - when: "fact.age >= 13"
      text: "Your body is still filling out; you are quicker and can go for longer."

- id: summary.trend_up
  variants:
    - text: "You have more wind than you did a year ago; {fact.phrase} is the reason."
    - text: "Your body is in better order than it was last year, thanks to {fact.phrase}."
    - text: "You are fitter than you were twelve months ago, and {fact.phrase} did it."

- id: summary.trend_down
  variants:
    - when: "fact.cause == 'aging'"
      text: "You are a little slower than last year. Nothing happened; it is only age."
    - when: "fact.cause == 'aging'"
      text: "Things that were easy a year ago take slightly more out of you now. That is age, and nothing else."
    - when: "fact.cause == 'aging'"
      text: "Another year, and your body gave up a little more ground to it."
    - when: "fact.cause != 'aging'"
      text: "You tire sooner than you did a year ago; {fact.phrase} will do that."
    - when: "fact.cause != 'aging'"
      text: "You are in worse shape than you were last year, mostly from {fact.phrase}."
    - when: "fact.cause != 'aging'"
      text: "Your body lost ground this year. The main reason was {fact.phrase}."

- id: summary.illness
  variants:
    - when: "fact.illnesses == 1"
      text: "You lost a week or so to the flu."
    - when: "fact.illnesses == 1 && fact.cause != 'illness'"
      text: "Apart from a bout of flu, you were well."
    - when: "fact.illnesses > 1"
      text: "You were ill more than once."

- id: summary.quiet
  variants:
    - when: "fact.stage == 'early'"
      text: "A year of small discoveries: stairs, puddles, the word no."
    - when: "fact.stage == 'early'"
      text: "Your days are meals, naps and the same three books."
    - when: "fact.stage == 'early'"
      text: "You learn the names of things, a few each day."
    - when: "fact.stage == 'childhood'"
      text: "School, weekends, school. The year has a shape you do not have to think about."
    - when: "fact.stage == 'childhood'"
      text: "Nothing happens that you will remember as an adult, which is one definition of a good year."
    - when: "fact.stage == 'childhood'"
      text: "A long summer, and then the classroom smell of September again."
    - when: "fact.stage == 'adolescence'"
      text: "The year passes in classrooms and in your own head."
    - when: "fact.stage == 'adolescence'"
      text: "Nothing changes on the outside this year. On the inside it does not feel that way."
    - when: "fact.stage == 'adolescence'"
      text: "A year of waiting to be older."
    - when: "fact.stage == 'early_adulthood'"
      text: "The year keeps its shape. Nothing in it is hard to describe and nothing stands out."
    - when: "fact.stage == 'early_adulthood'"
      text: "A steady year. You would have trouble telling it apart from the last one."
    - when: "fact.stage == 'early_adulthood'"
      text: "Twelve months go by without an event you would put in a letter."
    - when: "fact.stage == 'midlife'"
      text: "A quiet year. The weeks repeat, and you let them."
    - when: "fact.stage == 'midlife'"
      text: "The same year as last year, a little faster."
    - when: "fact.stage == 'midlife'"
      text: "Nothing to report, which at this age you have learned to count as news."
    - when: "fact.stage == 'late_career'"
      text: "An even year. The seasons seem closer together than they used to."
    - when: "fact.stage == 'late_career'"
      text: "No surprises this year, and you find you do not miss them."
    - when: "fact.stage == 'late_career'"
      text: "The year goes by in its usual order."
    - when: "fact.stage == 'old_age'"
      text: "A quiet year, the kind you are glad of now."
    - when: "fact.stage == 'old_age'"
      text: "The days are much alike. You notice the light changing with the seasons more than you used to."
    - when: "fact.stage == 'old_age'"
      text: "Another year, kept small and in order."
    - fallback: true
      text: "A quiet year."

# One sentence recalling the event of the year. `fact.highlight` is "<fact kind>:<detail>".
- id: summary.highlight
  variants:
    - when: "fact.highlight == 'birth'"
      text: "You arrived, and then mostly slept."
    - when: "fact.highlight == 'birth'"
      text: "You will remember none of it."
    - when: "fact.highlight == 'milestone:first_steps'"
      text: "You learned to walk this year, and after that nothing below waist height was safe."
    - when: "fact.highlight == 'milestone:first_steps'"
      text: "This was the year you stood up and walked."
    - when: "fact.highlight == 'milestone:school_start'"
      text: "This was the year you started school."
    - when: "fact.highlight == 'milestone:adult'"
      text: "You became an adult this year, at least in law."
    - when: "fact.highlight == 'milestone:decade'"
      text: "A birthday with a zero in it, and otherwise a year much like the others."
    - when: "fact.highlight == 'milestone:decade'"
      text: "You began a new decade."
    - when: "fact.highlight == 'milestone:sixty_five'"
      text: "Sixty-five came and went."
    - when: "fact.highlight == 'band_changed:down'"
      text: "Your body made itself heard this year."
    - when: "fact.highlight == 'band_changed:down'"
      text: "This was a year you felt in your legs and lungs."
    - when: "fact.highlight == 'band_changed:up'"
      text: "By the end of the year you could feel the difference in your body."
    - when: "fact.highlight == 'band_changed:up'"
      text: "You are more capable than you were a year ago, and you can tell."
    - when: "fact.highlight == 'choice:team_join'"
      text: "This was the year you joined the team."
    - when: "fact.highlight == 'choice:swim_start'"
      text: "This was the year you started exercising properly."
    - when: "fact.highlight == 'choice:routine_drop'"
      text: "This was the year the training stopped."
    - when: "fact.highlight == 'choice:loop_go'"
      text: "This was the year you started walking in the mornings."
    - when: "fact.highlight == 'illness_lingers'"
      text: "The flu took weeks to let go of you."
    - fallback: true
      text: "It was not a year like the others."
