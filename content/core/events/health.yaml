- id: illness.flu
  sourceClass: chance
  when: "!has('flu')"
  cooldownMonths: 2
  hazard:
    base:
      perYear: 0.08
      population: all ages
      source: "Tokars, Olsen & Reed 2018, Clinical Infectious Diseases: about 8% of the US population has symptomatic influenza in an average season"
      asOf: 2018
    factors:
      - { id: flu_season, when: "world.month == 12 || world.month <= 3", beta: 1.6 }
    # Four in-season months at exp(1.6) and eight at 1 give a mean multiplier of 2.318. The months
    # in which a second flu cannot start (while ill, and the cooldown) remove a further 1.5% of
    # cases, measured in a 100,000-life batch, so the constant is 2.318 x 0.985.
    normalization: 2.283
  effects:
    - startProcess: flu
  fact: { kind: illness_started, data: { illness: "'flu'" } }
