# The labor market (design §7.13): how people find work, are paid, get on, and lose their jobs.
# The occupations themselves are in occupations.yaml.
#
# Figures marked (memory) were written from memory of the cited source and are to be pinned;
# those marked (calibrated) were set with the batch tool against the targets in docs/CALIBRATION.md.
source: "BLS Current Population Survey, JOLTS and Education Pays 2024 (memory), with calibrated parameters"

# Rungs within an occupation. `pay` is relative to the occupation's median; `months` and `skill`
# are what it takes to be considered for the rung.
ladder:
  - { id: junior, prefix: "junior ", pay: 0.8, months: 0, skill: 0 }
  - { id: established, prefix: "", pay: 1.0, months: 36, skill: 0.3 }
  - { id: senior, prefix: "senior ", pay: 1.18, months: 108, skill: 0.55 }

employers:
  # Fictional employers (design decision Q10): a first word and a second that fits the sector.
  names:
    first: [Alder, Bellwether, Cobalt, Dunmore, Eastgate, Fairhaven, Granite, Hollis, Ironbridge, Juniper, Kestrel, Lakeshore, Meridian, Northfield, Oakhurst, Pinecrest, Quarry, Redwood, Summit, Tidewater, Upland, Valley, Westbrook, Yarrow, Harbor, Crescent, Sterling, Keystone, Lantern, Prairie]
    bySector:
      retail: [Market, Outfitters, Stores, Hardware, Goods]
      hospitality: [Grill, Kitchen, Diner, Hotel, Cafe]
      transport: [Freight, Logistics, Delivery, Distribution]
      services: [Services, Maintenance, Salon, Security]
      health: [Medical Center, Clinic, Health, Home Care, Dental]
      construction: [Builders, Construction, Electric, Plumbing & Heating, Contracting]
      manufacturing: [Manufacturing, Auto, Fabrication, Works]
      business: [Group, Partners, Associates, Solutions, Supply]
      finance: [Financial, Realty, Accounting, Trust]
      tech: [Systems, Software, Labs, Data]
      public: [County, City Department, Township]
      education: [School District, Academy, College, Learning Center]
      media: [Media, Studio, Press, Gazette]
      agriculture: [Farms, Orchards, Growers]
    managers: [Ms. Alvarez, Mr. Banerjee, Ms. Castillo, Mr. Dunn, Ms. Eze, Mr. Fischer, Ms. Grant, Mr. Hale, Ms. Ito, Mr. Jensen, Ms. Kowalski, Mr. Lindqvist, Ms. Moreno, Mr. Nwosu, Ms. Ortiz, Mr. Park, Ms. Quinn, Mr. Reyes, Ms. Silva, Mr. Tran, Ms. Usman, Mr. Vance, Ms. Whitfield, Mr. Yoder]
  # Some employers simply pay more than others for the same work (Card, Heining & Kline 2013).
  paySd: 0.09
  # A struggling employer is how most people lose a job: quiet trouble first, with signs, then
  # either recovery or layoffs. The monthly chance of trouble is set so that unemployment by
  # schooling matches BLS 2024 (6.2, 4.2, 3.5, 2.9, 2.3, 1.8 percent) at the reference rate.
  trouble:
    source: "BLS JOLTS layoffs and discharges; BLS Education Pays 2024 (calibrated)"
    perMonth: { less_than_hs: 0.026, high_school: 0.017, some_college: 0.014, associate: 0.012, bachelor: 0.009, graduate: 0.007 }
    perPointOfUnemployment: 0.22
    quietMonths: [3, 10]
    recoverPerMonth: 0.05
    layoffsPerMonth: 0.09
    layoffMonths: [3, 6]
    laidOffPerMonth: 0.25
    closes: 0.15
    signalPerMonth: 0.35

search:
  source: "BLS CPS gross flows: about a quarter of the unemployed find work in a month (memory); callback studies as cited"
  applicationsPerMonth: 8
  offerPerApplication: 0.036
  # Each point of unemployment above the reference rate, on the log-odds of an offer.
  perPointOfUnemployment: -0.16
  # The sector's own state: its index against trend, in log points.
  sector: 2.0
  # Skill in the line of work, 0 to 1.
  experience: 1.6
  # Someone who has never held a job.
  firstJob: -0.35
  # Long spells out of work put employers off (Kroft, Lange & Notowidigdo 2013).
  perSixMonthsOut: -0.25
  perDecadeOver50: -0.3
  # How the interview goes: extraversion and agreeableness, a little.
  interview: 0.15
  fit: 0.25
  # Documented direct effects (design decision Q1): in field experiments that send out matched
  # applications, white applicants receive 36% more callbacks than equally qualified Black
  # applicants and 24% more than Latino applicants, with no change over 25 years.
  callbacks:
    source: "Quillian, Pager, Hexel & Midtbøen 2017, PNAS 114(41): meta-analysis of US hiring field experiments 1989–2015 (memory)"
    byGroup: { black: -0.31, hispanic: -0.22 }
  # Monthly chance that someone in work hears of a better job, by age. Set against median tenure
  # of 3.9 years and 12 to 13 jobs between 18 and 56 (BLS; NLSY79).
  outsideOffer: [[16, 0.05], [22, 0.045], [28, 0.02], [35, 0.008], [45, 0.005], [65, 0.002]]
  outsideRaise: [0.02, 0.10]
  sexTyping: 1.0
  levels:
    - { id: none, label: Not looking, description: "You are not looking and do not want to hear about openings.", applications: 0, outside: 0 }
    - { id: open, label: Open to offers, description: "In work, you keep an ear out. Out of work, you look the way most people do.", applications: 1, outside: 1 }
    - { id: active, label: Looking hard, description: "Applications every day when you are out of work; while in work, you chase every opening.", applications: 1.6, outside: 1.8 }
  default: open

pay:
  source: "BLS OES percentiles for within-occupation spread; Mincer-style returns (calibrated)"
  # A person's standing in the pay of whatever they do: part ability and temperament, part luck.
  personalSd: 1.0
  fit: 0.6
  # Weight of the parents' schooling, beyond what it did for the person's own.
  background: 0.6
  offerNoise: 0.25
  # Part-time work pays less by the hour (Hirsch 2005).
  partTimeHourly: 0.9
  # Raise beyond the going rate, in percent, per point of performance above the typical level.
  merit: 6
  typicalPerformance: 0.6
  negotiate:
    source: "Babcock & Laschever 2003; Marks & Harold 2011 (memory)"
    succeeds: 0.55
    withdrawn: 0.03
    gain: [0.03, 0.09]

# Performance is a slow stock, 0 to 1, where 0.5 is adequate. It moves toward a level set by fit
# for the work, conscientiousness, skill, effort and how overstretched the person is.
performance:
  fit: 0.07
  conscientiousness: 0.07
  skill: 0.18
  strain: -0.25
  noise: 0.08
  months: 10
  # At a yearly review, the chance of moving up a rung when eligible and doing well.
  promote: 0.4
  toManagement: 0.025
  warnBelow: 0.32
  dismissedPerMonth: 0.06
  levels:
    - { id: coast, label: Coasting, description: "You do what is asked and go home on time.", effort: -0.1, hours: 0.92 }
    - { id: steady, label: Steady, description: "A proper day's work.", effort: 0, hours: 1 }
    - { id: push, label: Pushing, description: "First in, last out, and work comes home with you.", effort: 0.09, hours: 1.2 }
  default: steady

# Skill in a line of work, 0 to 1 (design §7.5): grows with months of doing it, more slowly the
# more there is, faster for the able; fades when unused toward a floor that long practice raises.
skill:
  source: "Design parameters after Ericsson; job-tenure wage profiles (calibrated)"
  perMonth: 0.02
  power: 1.5
  aptitude: 0.25
  fadeMonths: 120
  retained: 0.6
  related: 0.5

separations:
  source: "BLS JOLTS quits and discharges (memory)"
  # Leaving a job for no job, by age.
  quitPerMonth: [[16, 0.045], [20, 0.03], [25, 0.01], [30, 0.004], [45, 0.0012], [60, 0.0012]]
  # Layoffs fall on newer staff first: exposure is divided by one plus years of tenure over this.
  tenureShield: 6
  # Let go with no warning at all.
  suddenPerMonth: 0.0012
  firstYear: 1.6

participation:
  source: "BLS, Employment Characteristics of Families 2023; BLS CPS by age and school enrollment (memory)"
  fathers: 0.93
  mothers: 0.72
  mothersPartTime: 0.25
  # Share of people of each age, still at school, who hold a job.
  teens: [[15, 0], [16, 0.18], [17, 0.28], [18, 0.35]]
  students: 0.45
  # Chance per year of retiring, by age, for those who are able to.
  retire: [[55, 0.012], [60, 0.06], [62, 0.2], [64, 0.2], [65, 0.3], [67, 0.3], [70, 0.35], [75, 0.45]]
  stopBy: 80
  # Stepping out of work for a while: caring for someone, illness, a spell at home (BLS CPS
  # flows between employment and not in the labor force). Monthly chance of leaving, by sex, for
  # people 22 to 60; and of coming back. Set so that about 80% of people 25–54 are in work.
  # `alone` scales the chance for someone with no partner in work at home.
  stepOut: { female: 0.0075, male: 0.0028, alone: 0.8, backAlone: 1.3, fromAge: 22, untilAge: 60 }
  stepBack: 0.028

# State programs differ; this is the common shape, with each state's weekly cap from states.csv.
unemploymentInsurance:
  source: "US Department of Labor, Comparison of State Unemployment Insurance Laws 2024 (memory)"
  replacement: 0.47
  weeks: 26
  minMonths: 6

childSupport:
  source: "Census, Custodial Mothers and Fathers and Their Child Support 2017 (memory)"
  shareOfEarnings: 0.12
  paysAtAll: 0.6

# Courses that end in a credential (design §7.12). Certificates are short and open to anyone with
# the schooling; graduate programs admit on the college record.
programs:
  - { id: hvac, label: heating and cooling certificate, kind: certificate, credential: hvac_certificate, needs: high_school, months: 10, cost: 9000, completes: 0.75, weight: 4, source: "NCES IPEDS certificate programs (memory)" }
  - { id: auto_tech, label: automotive technician certificate, kind: certificate, credential: mechanic_certificate, needs: high_school, months: 12, cost: 9000, completes: 0.75, weight: 8, source: "NCES IPEDS (memory)" }
  - { id: welding, label: welding certificate, kind: certificate, credential: welding_certificate, needs: high_school, months: 8, cost: 7000, completes: 0.75, weight: 4, source: "NCES IPEDS (memory)" }
  - { id: cdl, label: commercial driving course, kind: certificate, credential: commercial_license, needs: less_than_hs, months: 2, cost: 5000, completes: 0.85, weight: 18, source: "FMCSA entry-level driver training (memory)" }
  - { id: cosmetology, label: cosmetology school, kind: certificate, credential: cosmetology_license, needs: high_school, months: 11, cost: 14000, completes: 0.7, weight: 6, source: "NCES IPEDS (memory)" }
  - { id: practical_nursing, label: practical nursing program, kind: certificate, credential: practical_nursing_license, needs: high_school, months: 12, cost: 12000, completes: 0.7, weight: 6, source: "NCES IPEDS; NCSBN NCLEX-PN pass rates (memory)" }
  - { id: paramedic, label: paramedic program, kind: certificate, credential: paramedic_certificate, needs: high_school, months: 12, cost: 8000, completes: 0.7, weight: 3, source: "NREMT (memory)" }
  - { id: real_estate, label: real estate license course, kind: certificate, credential: real_estate_license, needs: high_school, months: 3, cost: 1200, completes: 0.75, weight: 5, source: "State licensing boards (memory)" }
  - { id: teaching, label: teacher certification program, kind: certificate, credential: teaching_certificate, needs: bachelor, months: 12, cost: 12000, completes: 0.85, weight: 8, source: "Title II reports on teacher preparation (memory)" }
  - { id: medicine, label: medical school, kind: graduate, credential: medical_degree, needs: bachelor, majors: [stem, health], months: 48, cost: 62000, bar: 3.75, completes: 0.94, weight: 3, source: "AAMC applicants and matriculants; tuition and fees (memory)" }
  - { id: law, label: law school, kind: graduate, credential: law_license, needs: bachelor, months: 36, cost: 50000, bar: 3.35, completes: 0.8, weight: 5, source: "ABA 509 disclosures; bar passage (memory)" }
  - { id: pharmacy, label: pharmacy school, kind: graduate, credential: pharmacy_license, needs: bachelor, majors: [stem, health], months: 48, cost: 40000, bar: 3.2, completes: 0.85, weight: 2, source: "AACP (memory)" }
  - { id: physical_therapy, label: physical therapy doctorate, kind: graduate, credential: physical_therapy_license, needs: bachelor, majors: [stem, health], months: 36, cost: 38000, bar: 3.5, completes: 0.9, weight: 2, source: "CAPTE (memory)" }
  - { id: counseling, label: master's in counseling, kind: graduate, credential: counseling_license, needs: bachelor, months: 30, cost: 22000, bar: 3.0, completes: 0.8, weight: 6, source: "NCES Digest, master's degrees (memory)" }
  - { id: doctorate, label: doctoral program, kind: graduate, credential: doctorate, needs: bachelor, months: 66, cost: 0, bar: 3.6, completes: 0.55, weight: 5, source: "Council of Graduate Schools, PhD completion (memory)" }
  - { id: masters, label: master's in business, kind: graduate, credential: masters_degree, needs: bachelor, months: 21, cost: 33000, bar: 3.0, completes: 0.88, weight: 16, source: "NCES Digest; GMAC (memory)" }
# How often people who could start one do, in a given year: set so that about 14% of adults hold
# a graduate degree (Census CPS 2023) and about 8% a certificate as their highest credential.
programEntry:
  source: "Census CPS educational attainment 2023; NCES certificates (calibrated)"
  certificatePerYear: 0.045
  graduatePerYear: 0.06
  untilAge: 40
# A bachelor's degree in these fields carries the credential with it.
degreeCredentials: { education: teaching_certificate }
